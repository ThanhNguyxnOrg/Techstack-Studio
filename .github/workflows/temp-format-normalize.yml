name: Temporary Prettier normalization

on:
  push:
    branches:
      - tooling/format-static-logo-restore

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier to the four touched source files
        run: npx prettier --write scripts/generateStandaloneSvgLibrary.mjs src/utils/studioLogic.ts src/utils/studioLogic.test.ts src/utils/catalogIntegrity.test.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-format-normalize.yml
          git add scripts/generateStandaloneSvgLibrary.mjs src/utils/studioLogic.ts src/utils/studioLogic.test.ts src/utils/catalogIntegrity.test.ts
          git diff --cached --check
          git commit -m "style(icons): normalize TypeScript logo changes"
          git push origin HEAD:"${GITHUB_REF_NAME}"
