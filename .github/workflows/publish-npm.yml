name: Publish CLI & MCP Package to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish with --dry-run (nothing uploaded)
        required: false
        default: false
        type: boolean
      tag:
        description: npm dist-tag (e.g. latest, next)
        required: false
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ThanhNguyxnOrg/.github/.github/workflows/publish-npm.yml@ci-v1
    with:
      job_name: Publish techstack-studio to npm
      node_version_file: .nvmrc
      package_manager: npm
      cache: npm
      install_command: npm ci
      verify_command: npm run verify
      build_command: npm run build:cli
      working_directory: packages/cli
      access: public
      tag: ${{ inputs.tag || 'latest' }}
      provenance: true
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
