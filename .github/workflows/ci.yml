name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@18a3fd8b46540a0cc8895b08437d6150d7deda6f
    with:
      job_name: Verify
      node_version_file: .nvmrc
      package_manager: npm
      cache: npm
      lint_command: npm run format:check
      typecheck_command: npm run typecheck
      test_command: npm test
      build_command: npm run build
      artifact_name: techstack-studio-dist
      artifact_path: dist/
      artifact_retention_days: 5
