name: Regenerate patched SVG assets (retry after generator fix)

on:
  push:
    branches:
      - patch/logo-motion-2026-10-30
    paths:
      - .github/workflows/regenerate-icons-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate SVG library from the patched generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate source, animated SVGs, manifest and export parts
        run: node scripts/generateStandaloneSvgLibrary.mjs

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "Generated assets already match the patched generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/source public/icons/animated docs/animation/animation-manifest.json src/data/standaloneSvgParts.json
          git commit -m "build(icons): regenerate SVG library from patched choreography"
          git push origin "HEAD:${GITHUB_REF_NAME}"
