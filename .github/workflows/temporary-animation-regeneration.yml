name: Temporary animation asset regeneration

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-animation-asset-regeneration
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate standalone icon assets
        run: npm run generate:icons

      - name: Verify generated output
        run: npm run format:check && npm run typecheck && npm test && npm run build

      - name: Commit generated assets
        run: |
          git add docs/animation/animation-manifest.json public/icons/animated public/icons/source src/data/standaloneSvgParts.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(icons): regenerate hand-tuned motion assets"
          git push origin HEAD:main
