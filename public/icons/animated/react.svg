<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="React"><style>@keyframes tss_react_orb{0%{stroke-dashoffset:64}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}@keyframes tss_react_spn{0%{transform:rotate(0deg)}100%{transform:rotate(180deg)}}@keyframes tss_react_nuc{0%,100%{transform:scale(0.85);fill:#61DAFB}50%{transform:scale(1.18);fill:#E0F2FE}}.tss_react_spn{transform-origin:12px 12px;animation:tss_react_spn 6s linear infinite}.tss_react_orb{stroke-dasharray:64;animation:tss_react_orb 2.4s ease-in-out infinite}.tss_react_nuc{transform-origin:12px 12px;animation:tss_react_nuc 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){.tss_react_spn,.tss_react_orb,.tss_react_nuc{animation:none!important;transform:none!important;stroke-dashoffset:0!important}}</style><g class="tss_react_spn"><ellipse cx="12" cy="12" rx="9.8" ry="3.7" fill="none" stroke="#61DAFB" stroke-opacity="0.3" stroke-width="1"/><ellipse cx="12" cy="12" rx="9.8" ry="3.7" transform="rotate(60 12 12)" fill="none" stroke="#61DAFB" stroke-opacity="0.3" stroke-width="1"/><ellipse cx="12" cy="12" rx="9.8" ry="3.7" transform="rotate(120 12 12)" fill="none" stroke="#61DAFB" stroke-opacity="0.3" stroke-width="1"/><ellipse class="tss_react_orb" pathLength="64" cx="12" cy="12" rx="9.8" ry="3.7" fill="none" stroke="#61DAFB" stroke-width="1.35"/><ellipse class="tss_react_orb" style="animation-delay:-0.3s" pathLength="64" cx="12" cy="12" rx="9.8" ry="3.7" transform="rotate(60 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.35"/><ellipse class="tss_react_orb" style="animation-delay:-0.6s" pathLength="64" cx="12" cy="12" rx="9.8" ry="3.7" transform="rotate(120 12 12)" fill="none" stroke="#61DAFB" stroke-width="1.35"/></g><circle class="tss_react_nuc" cx="12" cy="12" r="2"/></svg>