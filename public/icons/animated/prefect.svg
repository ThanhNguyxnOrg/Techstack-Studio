<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Prefect"><style>@keyframes tss_prefect_al{0%{opacity:0}4%,92%{opacity:1}98%,100%{opacity:0}}@keyframes tss_prefect_mv{0%{opacity:0;transform:rotate(-20deg)}38%{opacity:1;transform:rotate(2deg)}48%{transform:rotate(0)}62%{transform:rotate(2deg)}74%{transform:rotate(-2deg)}86%{transform:rotate(2deg)}100%{transform:rotate(0)}}@keyframes tss_prefect_rg{0%{opacity:0;transform:scale(.6)}21%{opacity:.5;transform:scale(1)}42%,100%{opacity:0;transform:scale(1.4)}}@keyframes tss_prefect_pl{0%,60%{transform:scale(1)}80%{transform:scale(1.02)}100%{transform:scale(1)}}.tss_prefect_al{animation:tss_prefect_al 3.6s linear infinite}.tss_prefect_mv{transform-box:fill-box;transform-origin:50% 50%;animation:tss_prefect_mv 3.6s cubic-bezier(.22,1,.36,1) infinite}.tss_prefect_rg{transform-box:fill-box;transform-origin:50% 50%;animation:tss_prefect_rg 3.6s cubic-bezier(.22,1,.36,1) infinite}.tss_prefect_pl{transform-box:fill-box;transform-origin:50% 50%;animation:tss_prefect_pl 3.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){.tss_prefect_al,.tss_prefect_mv,.tss_prefect_rg,.tss_prefect_pl{animation:none!important}.tss_prefect_al{opacity:1!important}.tss_prefect_mv{opacity:1!important;transform:none!important}.tss_prefect_rg{opacity:0!important}.tss_prefect_pl{transform:none!important}}</style><g class="tss_prefect_al"><g class="tss_prefect_pl"><g class="tss_prefect_mv"><path fill="#979A9B" fill-rule="evenodd" d="M12 8.003 4.288 4.002 12 0l7.713 4v8.004L12 16v8l-7.71-4v-8L12 16V8.003Z"/></g><circle class="tss_prefect_rg" cx="12" cy="12" r="8" fill="none" stroke="#888B8C" stroke-width=".5"/></g></g></svg>