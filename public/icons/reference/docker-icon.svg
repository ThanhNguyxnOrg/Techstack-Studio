<svg viewBox="-56 -40 624 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Docker">
  <defs>
    <style>
      @keyframes second-floor-ani {
        0%, 10% { transform: translateX(-45px); }
        35%, 65% { transform: translateX(0px); }
        90%, 100% { transform: translateX(-45px); }
      }
      @keyframes third-floor-ani {
        0%, 10% { transform: translateX(-110px); }
        42%, 65% { transform: translateX(0px); }
        90%, 100% { transform: translateX(-110px); }
      }
      @keyframes whale-ani {
        0%, 100% { transform: rotate(-8deg); }
        40%, 60% { transform: rotate(6deg); }
      }
      #docker-icon {
        animation: whale-ani 4.2s ease-in-out infinite;
        transform-origin: 256px 280px;
      }
      .docker { fill: #099CEC; }
      .second-floor { animation: second-floor-ani 4.2s ease-in-out infinite; }
      .third-floor { animation: third-floor-ani 4.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        #docker-icon, .second-floor, .third-floor { animation: none !important; transform: none !important; }
      }
    </style>
  </defs>
